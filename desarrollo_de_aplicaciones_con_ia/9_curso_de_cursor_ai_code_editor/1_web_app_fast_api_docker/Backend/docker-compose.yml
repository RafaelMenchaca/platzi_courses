# PASO 7: docker-compose para desarrollo (PostgreSQL + API)
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: platziflix
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/platziflix
    depends_on:
      - db

volumes:
  postgres_data:
